<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Concursinho — um pouco hoje, mais perto amanhã</title>
  <desc id="desc">Capa em tons de papel e verde, com um livro aberto e os pilares plano, leitura e foco.</desc>
  <rect width="1440" height="440" rx="28" fill="#f5f1e7"/>
  <path d="M1090 0h322a28 28 0 0 1 28 28v384a28 28 0 0 1-28 28h-322z" fill="#214e3e"/>
  <circle cx="1312" cy="76" r="156" fill="none" stroke="#47725e" stroke-width="1"/>
  <circle cx="1312" cy="76" r="114" fill="none" stroke="#47725e" stroke-width="1"/>
  <text x="70" y="98" font-family="Georgia,serif" font-size="66" letter-spacing="-2" fill="#214e3e">concursinho.</text>
  <text x="74" y="151" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#a86c32">SEU ESTUDO, COM CONTINUIDADE.</text>
  <text x="70" y="235" font-family="Georgia,serif" font-size="52" fill="#243c31">Um pouco hoje.</text>
  <text x="70" y="296" font-family="Georgia,serif" font-size="52" fill="#243c31">Mais perto amanhã.</text>
