  <text x="260" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#214e3e">LEITURA</text>
  <text x="387" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#214e3e">FOCO</text>
