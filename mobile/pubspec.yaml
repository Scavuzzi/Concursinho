name: concursinho_mobile
description: Estudo offline do TJPB com leitor de PDF e leitura adaptada.
publish_to: none
version: 1.2.0+3
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^2.4.8
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  crypto: ^3.0.8
  sqflite: 2.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.9.4
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/pdfs/
    - assets/licenses/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: SourceSerif
      fonts:
        - asset: assets/fonts/SourceSerif.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
